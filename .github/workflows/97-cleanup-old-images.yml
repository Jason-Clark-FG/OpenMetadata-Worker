name: "Worker: Step 97 - Cleanup Old Container Images"
on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview deletions without actually deleting'
        type: boolean
        default: true

env:
  # Images only need to survive long enough for vuln scanning - no rollback need.
  KEEP_TAGGED: 2
  OLDER_THAN: '3 days'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write  # Required for deleting packages
      contents: read
    strategy:
      matrix:
        # Images produced by the 04-03-0*-build-ghcr-container* workflows
        package-name:
          - 'openmetadata-db'
          - 'openmetadata-server'
          - 'openmetadata-ingestion'
          - 'openmetadata-elasticsearch'
      fail-fast: false
    steps:
      - name: Delete old versions of ${{ matrix.package-name }}
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ matrix.package-name }}
          keep-n-tagged: ${{ env.KEEP_TAGGED }}
          older-than: ${{ env.OLDER_THAN }}
          exclude-tags: latest
          delete-untagged: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
  # First runs: trigger manually via workflow_dispatch with dry_run checked,
  # confirm the log output looks right, then re-run for real (repeat as needed
  # to burn down the backlog - no need to wait for the weekly schedule).
