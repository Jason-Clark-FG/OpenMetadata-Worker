name: Cleanup Old Container Images
on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

env:
  MIN_VERSIONS_TO_KEEP: 10

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write  # Required for deleting packages
      contents: read
    strategy:
      matrix:
        # Images produced by the 04-03-0*-build-ghcr-container* workflows
        package-name:
          - 'openmetadata-db'
          - 'openmetadata-server'
          - 'openmetadata-ingestion'
          - 'openmetadata-elasticsearch'
      fail-fast: false
    steps:
      - name: Delete old versions of ${{ matrix.package-name }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package-name }}
          package-type: 'container'
          min-versions-to-keep: ${{ env.MIN_VERSIONS_TO_KEEP }}
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}
